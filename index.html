<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./styles/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <title>TODO APP</title>
</head>

<body>
  <div id="overlay">
    <div id="spinner"></div>
  </div>
  <h1 class="app-title">TODO App</h1>
  <form id="singup-form" class="form-container">
    <h2 class="form-title">Регистрация</h2>
    <input class="form-input" id="singup-email" type="email" placeholder="email" required>
    <input class="form-input" id="singup-password" type="password" placeholder="Пароль" required>
    <button class="form-button submit" type="submit">Зарегистрироваться</button>
    <button class="form-button secondary type=" button" id="signin-btn">Войти</button>
    <button id="google-signup-button">Войти через Google </button>
  </form>
  <form id="signin-info" class="form-container">
    <h2 class="form-title">Авторизация</h2>
    <input class="form-input" id="signin-email" type="email" placeholder="email" required>
    <input class="form-input" id="signin-password" type="password" placeholder="Пароль" required>
    <button class="form-button submit" type="submit">Войти</button>
    <button id="google-signin-button">Продолжить с Google </button>
    <button id="forgot-password-button" type="button" class="form-button secondary">Забыли пароль?</button>
  </form>
  <form id="forgot-password-form"">
    <input id="forgot-password-email" class="form-input" required type="email">
    <button type="submit" class="form-button submit">Отправить ссылку для сброса
      пароля</button>
    </form>
    <div id="forgot-password-message"></div>
  <div id="task-container">
    <div class="input-block">
      <input type="text" id="task-input" placeholder="Введите задачу" />
      <button id="add-button">
        <img src="./assets/icons/icon-add.png" class="icons" />
      </button>
    </div>
    <div id="posts-container"></div>
    <button id="deleteCompletedButton">Удалить все выполненные задачи</button>
  </div>
  <button id="logout-button" class="logout-button">Выйти</button>
  <script type="module" src="./src/app.js"></script>
</body>

</html>
